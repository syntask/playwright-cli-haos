name: Playwright CLI
version: 0.1.0
slug: playwright_cli
description: Run Playwright CLI commands from Home Assistant
url: https://github.com/syntask/playwright-cli-haos
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
watchdog: http://[HOST]:[PORT:8080]/health
discovery:
  - playwright_cli
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Authenticated API used by the companion Home Assistant integration (not mapped to the host)
options:
  api_token: ""
schema:
  api_token: password?
image: ghcr.io/syntask/playwright-cli-haos-{arch}
