run_command:
  name: Run CLI command
  description: Run a playwright-cli command line exactly as written.
  fields:
    command:
      name: Command
      description: >-
        Complete Playwright CLI command line, including any session selector or
        options, for example "-s=kitchen open https://example.com" or
        "-s=kitchen snapshot --json". Quotes are parsed, but no shell is used.
        Omit the leading playwright-cli.
      required: true
      example: -s=kitchen open https://example.com
      selector:
        text:
get_artifact:
  name: Get CLI artifact
  description: Read a screenshot, snapshot, trace, or other file from the app artifact directory.
  fields:
    path:
      name: Artifact path
      description: Relative path reported by the CLI, for example .playwright-cli/screenshot.png.
      required: true
      example: .playwright-cli/screenshot.png
      selector:
        text:
save_artifact:
  name: Save CLI artifact
  description: >-
    Copy an app artifact into Home Assistant's private artifact store and
    return an authenticated URL for notifications and dashboards.
  fields:
    path:
      name: Artifact path
      description: Relative path reported by the CLI, for example .playwright-cli/screenshot.png.
      required: true
      example: .playwright-cli/screenshot.png
      selector:
        text:
    destination:
      name: Destination
      description: >-
        Relative path in the private artifact store, for example
        playwright/screenshot.png. Existing files are overwritten.
      required: true
      example: playwright/screenshot.png
      selector:
        text:
