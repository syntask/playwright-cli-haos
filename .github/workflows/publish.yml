name: Publish app images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the leading v (for example 0.2.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and verify version
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REQUESTED_VERSION#v}"
          CONFIG_VERSION="$(sed -n 's/^version:[[:space:]]*//p' playwright_cli/config.yaml | head -n1)"
          MANIFEST_VERSION="$(python -c 'import json; print(json.load(open("custom_components/playwright_cli/manifest.json"))["version"])')"
          if [ -z "$VERSION" ] || [ "$VERSION" != "$CONFIG_VERSION" ] || [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Version mismatch: requested '$VERSION', app '$CONFIG_VERSION', integration '$MANIFEST_VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: playwright_cli/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/playwright-cli-haos-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/playwright-cli-haos-${{ matrix.arch }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Remind about package visibility
        run: |
          echo "::notice::If this is the first publish of ${{ matrix.arch }}, make the new GHCR package public in its package settings so Home Assistant can pull it."
